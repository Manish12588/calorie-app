# Linting and SAST (Static Application Security Testing) scan
# Lint -  ESLint
# SAST -

name: Code Quality

on:    
    #workflow_call:
    workflow_dispatch:

jobs:
    validate:
        name: Lint and Format Check
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "20"
                cache: "npm"
                cache-dependency-path: "./backend/package.json"
            
            - name: Install Dependencies
              working-directory: ./backend
              run: npm ci
              
              # LINT: Checks for syntax and style (Node equivalent of flake8)
              # npm install --save-dev eslint to keep below steps same
            #- name: Install ESLint
            #  run: npm install

            #- name: Run ESLint
            #  working-directory: ./backend 
            #  run: npm run lint
            
            - name: Run ESLint
              uses: sibiraj-s/action-eslint@v4
              with:
                #token: ${{ secrets.GITHUB_TOKEN }}
                #eslint-args: "--ignore-path .gitignore"
                extensions: "js"
                working-directory: "./backend"
                annotations: true

            # SAST: Static analysis of your written code (Equivalent to Bandit)
            - name: Run njsscan (Static Analysis)
              run: |
                pip install njsscan
                njsscan ./backend

            # SAST: Checking your 3rd party libraries for known vulnerabilities
            - name: Run npm audit (Dependency Scan)
              working-directory: ./backend
              run: npm audit --audit-level=high
