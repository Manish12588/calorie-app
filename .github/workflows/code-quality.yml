# Linting and SAST (Static Application Security Testing) scan
# Lint -  ESLint
# SAST -

name: Code Quality

on:    
    #workflow_call:
    workflow_dispatch:

jobs:
    validate:
        name: Lint and Format Check
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "20"
                cache: "npm"
                cache-dependency-path: "./backend/package.json"
            
            - name: Install Dependencies
              run: npm install
              working-directory: ./backend
            
              # LINT: Checks for syntax and style (Node equivalent of flake8)
              # npm install --save-dev eslint to keep below steps same
            
            - name: Install ESLint
              run: npm install

            - name: Run ESLint
              run: npm run lint

              # SAST: Checks for security vulnerabilities (Node equivalent of Bandit)
            - name: Run Snyk Security Scan
              uses: snyk/actions/node@master
              with:
                args: --file=backend/package.json
              env:
                SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}