# uses Trivy image scanner for CVEs - Docker Image
name: Image Scanner

on: 
    workflow_call:

jobs:
    image-scanner:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME  }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Pull Image from Docker Hub
              run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/calorie-app:${{ github.sha }}

            - name: Trivy Scanner
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/calorie-app:${{ github.sha }}
                severity: 'CRITICAL,HIGH'
                exit-code: '1'
                trivyignores: .trivyignore
            
            - name: Show Trivy table summary in logs
              if: always()
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/calorie-app:${{ github.sha }}
                format: 'table'
                severity: 'CRITICAL,HIGH'
                exit-code: '0'